services:
  - type: web
    name: mirage-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Database__MaxPoolSize
        value: "15"
      - key: Database__CommandTimeoutSeconds
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Jwt__Issuer
        value: mirage-api
      - key: Jwt__Audience
        value: mirage-client
      - key: Jwt__AccessTokenMinutes
        value: "60"
      # Browser sessions, on machines that may be shared.
      - key: Jwt__RefreshTokenDays
        value: "30"
      # Native apps identify themselves with X-Client-Platform: mobile and get a year, sliding on
      # every refresh. A phone is held in the hand behind a lock screen, and members expect it to
      # stay signed in the way every other app on the device does.
      - key: Jwt__MobileRefreshTokenDays
        value: "365"
      # Refresh tokens rotate, and the old one is revoked. A mobile client suspended or
      # disconnected mid-refresh replays the token it still holds; inside this window the API
      # re-issues rather than treating it as a breach and signing the member out.
      - key: Jwt__RefreshRotationGraceSeconds
        value: "60"
      - key: Swagger__Enabled
        value: "true"
      - key: Google__ClientId
        value: "924927421966-qcqec2u9kpeggje18p29d08u7ohb69fd.apps.googleusercontent.com"
      # Native apps mint ID tokens with their own `aud`, so each platform's client ID must be
      # accepted too or a valid app sign-in is rejected. Public identifiers, not secrets.
      - key: Google__IosClientId
        value: "924927421966-tv3vpqmmvgmj0e95auqh6jhbvo8bbd77.apps.googleusercontent.com"
      - key: PhotoValidation__RequireSamePerson
        value: "false"
      - key: Brand__LogoUrl
        value: "https://res.cloudinary.com/dl2z33x6z/image/upload/v1785248851/Asset_3Mirage_obqm6m.png"
      # The mark-plus-wordmark lockup, used as the newsletter masthead. Separate from LogoUrl
      # because that one fills square 32x32 slots, where a wide wordmark would render illegibly.
      - key: Brand__WordmarkUrl
        value: "https://www.themiragehub.com/brand/mirage-wordmark.png"
      # Firebase service-account JSON, base64-encoded (the raw JSON's private_key newlines do not
      # survive Render's env-var editor). Push notifications stay disabled until this is set.
      - key: Firebase__ServiceAccountJson
        sync: false
      # AWS KMS key that escrows each member's chat private key. Chat encryption provisions, restores and
      # rotates identities through it, so without this (and the AWS credentials it needs) every member is
      # locked out of encrypted messaging. Set in the dashboard alongside the AWS access key and secret.
      - key: ChatEncryptionKms__KeyId
        sync: false
      # Klipy API key for the chat GIF picker (Google's Tenor API shut down on 30 June 2026).
      # Until this is set, /api/v1/gifs returns 501 and the picker shows a "not available yet"
      # note — chat itself works without it.
      - key: Klipy__ApiKey
        sync: false
