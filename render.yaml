services:
  - type: web
    name: mirage-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Database__MaxPoolSize
        value: "15"
      - key: Database__CommandTimeoutSeconds
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Jwt__Issuer
        value: mirage-api
      - key: Jwt__Audience
        value: mirage-client
      - key: Jwt__AccessTokenMinutes
        value: "15"
      - key: Jwt__RefreshTokenDays
        value: "30"
      - key: Swagger__Enabled
        value: "true"
      - key: Google__ClientId
        value: "924927421966-qcqec2u9kpeggje18p29d08u7ohb69fd.apps.googleusercontent.com"
      - key: PhotoValidation__RequireSamePerson
        value: "false"
      - key: Brand__LogoUrl
        value: "https://res.cloudinary.com/dl2z33x6z/image/upload/v1785248851/Asset_3Mirage_obqm6m.png"
      # Firebase service-account JSON, base64-encoded (the raw JSON's private_key newlines do not
      # survive Render's env-var editor). Push notifications stay disabled until this is set.
      - key: Firebase__ServiceAccountJson
        sync: false
