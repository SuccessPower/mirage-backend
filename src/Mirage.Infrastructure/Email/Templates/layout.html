<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="x-apple-disable-message-reformatting"/>
  <meta name="color-scheme" content="light"/>
  <meta name="supported-color-schemes" content="light"/>
  <title>Mirage</title>
</head>
<body style="margin:0;padding:0;background-color:#F4F2FA;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    {{PREHEADER}}&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;&nbsp;&#847;
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4F2FA;padding:44px 0 60px;">
    <tr><td align="center" valign="top">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

        <!-- Header: logo mark + wordmark -->
        <tr><td style="padding:0 4px 24px;" align="left">
          <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
              <td style="width:32px;height:32px;" width="32">
                <img src="https://res.cloudinary.com/dl2z33x6z/image/upload/v1785248851/Asset_3Mirage_obqm6m.png" width="32" height="32" alt="Mirage" style="display:block;border:0;outline:none;"/>
              </td>
              <td style="padding-left:11px;vertical-align:middle;">
                <span style="font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:700;color:#1B1730;letter-spacing:-0.3px;">Mirage</span>
              </td>
            </tr>
          </table>
        </td></tr>

        <!-- Card -->
        <tr><td style="background:#FFFFFF;border-radius:20px;border:1px solid #EAE6F5;overflow:hidden;box-shadow:0 24px 48px -16px rgba(76,54,153,0.14);">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            {{CONTENT}}
          </table>
        </td></tr>

        <!-- Footer -->
        <tr><td style="padding:32px 20px 0;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td align="center" style="padding-bottom:14px;">
                <a href="https://mirage-ui-iota.vercel.app" style="font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;color:#6C4EF2;text-decoration:none;">Open Mirage</a>
                <span style="color:#D6D0E8;padding:0 10px;">&bull;</span>
                <a href="mailto:support@mirageapp.com" style="font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;color:#6C4EF2;text-decoration:none;">Help centre</a>
              </td>
            </tr>
            <tr>
              <td align="center" style="font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;color:#9791AC;line-height:1.7;">
                &copy; {{YEAR}} Mirage &nbsp;&bull;&nbsp; Relationship OS
              </td>
            </tr>
          </table>
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
